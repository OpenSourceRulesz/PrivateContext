[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "privatecontext"
version = "0.5.3"
description = "Lightweight, local-first activity tracker"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    # pynput is installed automatically on Windows/macOS (pure wheels
    # there) and skipped on Linux, where it pulls in evdev and needs C
    # headers to build. `pip install "privatecontext[full]"` forces it
    # everywhere. The capture loop degrades gracefully without it.
    'pynput; sys_platform == "win32" or sys_platform == "darwin"',
    "mss",     # screenshots (opt-in only)
    "pillow",  # JPEG screenshot encoding (opt-in screenshots)
    "mcp>=2",  # first-party MCP server (`pctx mcp`), stdio transport
]

[project.optional-dependencies]
full = [
    "pynput",  # click watcher + keyboard-activity timestamps for AFK
]
mcp = [
    "mcp>=2",  # first-party MCP server (`pctx mcp`), stdio transport
]

[project.scripts]
pctx = "privatecontext.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["privatecontext*"]

[tool.setuptools.package-data]
privatecontext = ["schema.sql"]
