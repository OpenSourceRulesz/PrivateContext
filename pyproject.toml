[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "privatecontext"
version = "0.1.0"
description = "Lightweight, local-first activity tracker"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pynput",  # click + activity-timestamp watchers
    "mss",     # screenshots (opt-in only)
    "mcp>=2",  # first-party MCP server (`pctx mcp`), stdio transport
]

[project.scripts]
pctx = "privatecontext.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["privatecontext*"]

[tool.setuptools.package-data]
privatecontext = ["schema.sql"]
