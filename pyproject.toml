[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "privatecontext"
version = "0.6.2"
description = "A private, local-first computer journal — your day, written down, on your machine only"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    # pynput is installed automatically on Windows/macOS (pure wheels
    # there) and skipped on Linux, where it pulls in evdev and needs C
    # headers to build. `pip install "privatecontext[full]"` forces it
    # everywhere. The capture loop degrades gracefully without it.
    'pynput; sys_platform == "win32" or sys_platform == "darwin"',
    # NOTE: `mcp` is intentionally NOT a base dependency — it lives in the
    # [mcp] extra only (`pip install "privatecontext[mcp]"`). `pctx mcp`
    # prints install instructions when the package is missing. Keep the
    # base install tiny: no new base dependencies.
    # NOTE: `mss`/`pillow` are intentionally NOT base dependencies either.
    # The user rejected the screenshots feature on security grounds
    # (2026-10-16 product decision), so the libraries live in the
    # [screenshots] extra only — the default install carries no
    # screenshot libraries at all. The capture code imports them lazily
    # and degrades gracefully when they're absent.
]

[project.urls]
Homepage = "https://github.com/OpenSourceRulesz/PrivateContext"
Repository = "https://github.com/OpenSourceRulesz/PrivateContext"

[project.optional-dependencies]
full = [
    "pynput",  # click watcher + keyboard-activity timestamps for AFK
]
mcp = [
    "mcp>=2",  # first-party MCP server (`pctx mcp`), stdio transport
]
screenshots = [
    "mss",     # screen capture for the opt-in --screenshots flag
    "pillow",  # JPEG screenshot encoding
]

[project.scripts]
pctx = "privatecontext.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["privatecontext*"]

[tool.setuptools.package-data]
privatecontext = ["schema.sql"]
